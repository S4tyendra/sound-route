[package]
name = "sound-route"
version = "0.1.0"
edition = "2021"
description = "PipeWire mixer: per-stream outputs, fan-out, and delay alignment"

[dependencies]
gdk-pixbuf = "0.20"
gtk4 = { version = "0.9", features = ["v4_12"] }
ksni = { version = "0.3.1", features = ["blocking"] }
serde_json = "1"
